# Render Blueprint — WebSocket-capable Crime AI backend.
# Deploy: New → Blueprint → select this repo. Fill secret env vars in the Render dashboard
# (values marked sync: false are prompted at create-time and never stored in git).
services:
  - type: web
    name: crime-ai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLE_CORS
        value: "1"
      # Catalyst-hosted frontend origin (comma-separated if you add more).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        value: saarika:v2.5
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: simran
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: ELEVENLABS_MODEL_KN
        value: eleven_v3
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: KANNADA_TTS_PROVIDER
        value: sarvam

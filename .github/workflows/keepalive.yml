# Keep the Render free-tier API awake by pinging /health every 5 minutes.
# Works even when no one has the frontend open.
#
# Optional repo secret: KEEP_ALIVE_URL
#   e.g. https://crime-ai-api.onrender.com/health
# If unset, defaults to the production Render health URL below.

name: Keep Render API awake

on:
  schedule:
    # Every 5 minutes (GitHub may delay a few minutes under load).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://crime-ai-api.onrender.com/health}"
          echo "Pinging $URL"
          curl -fsS --max-time 60 "$URL"
          echo
          echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"

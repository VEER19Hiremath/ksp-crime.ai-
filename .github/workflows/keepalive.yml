# Keep Render free-tier awake with NO browser tab open.
# Frontend KeepAlive still helps while a tab is open; this covers the rest.

name: Keep Render API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          URL="${KEEP_ALIVE_URL:-https://crime-ai-api.onrender.com/health}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo
              echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ) attempt=$i"
              exit 0
            fi
            echo "attempt $i failed; retrying..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1
